<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Investment · 내 계좌</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body>
<header class="topbar">
  <div class="brand">Stock Investment</div>
  <nav class="nav">
    <a href="/">홈</a><a href="/market">시장</a><a href="/stocks">종목</a><a class="on" href="/account">내 계좌</a><a href="/data">데이터</a>
  </nav>
  <div class="topbar-right"><span class="chip dashed">로컬 전용 입력</span></div>
</header>

<main class="page account-page">
  <section class="account-summary" id="account-summary">
    <div class="account-headline"><span>투자 자산</span><b class="num" id="invest-total">—</b><small id="invest-asof"></small></div>
    <div class="account-headline"><span>순자산</span><b class="num" id="net-worth-total">—</b><small id="net-worth-asof"></small></div>
  </section>

  <section class="card">
    <div class="card-head"><b>계좌별</b><span class="muted">식별자 없는 로컬 스냅샷 · 평가 불가 종목은 합계에서 제외</span></div>
    <div class="data-table-wrap">
      <table class="data-table account-source-table">
        <thead><tr><th>출처</th><th>평가액</th><th>현금</th><th>평가손익</th><th>기준일</th><th>포함 여부</th></tr></thead>
        <tbody id="account-source-rows"></tbody>
      </table>
    </div>
  </section>

  <section class="account-grid">
    <div class="card form-card">
      <div class="card-head"><b>수동 증권 계좌 입력</b><button type="button" class="button" id="add-manual-account">계좌 추가</button></div>
      <p class="muted form-note">한국 6자리 종목은 최신 로컬 종가를 사용합니다. 미국 종목은 수동 현재가가 없으면 평가 불가입니다.</p>
      <div id="manual-accounts-form"></div>
      <div class="form-actions"><span class="muted" id="manual-status"></span><button type="button" class="button primary" id="save-manual-accounts">수동 계좌 저장</button></div>
    </div>

    <div class="card form-card">
      <div class="card-head"><b>기타 자산 · 부채 입력 (순자산)</b><span class="muted">KRW</span></div>
      <label class="field compact-field"><span>스냅샷 기준일</span><input type="date" id="net-worth-date"></label>
      <div class="subform-head"><b>자산</b><button type="button" class="button" id="add-asset">자산 추가</button></div>
      <div id="asset-form-rows"></div>
      <div class="subform-head"><b>부채</b><button type="button" class="button" id="add-liability">부채 추가</button></div>
      <div id="liability-form-rows"></div>
      <div class="form-actions"><span class="muted" id="net-worth-status"></span><button type="button" class="button primary" id="save-net-worth">새 스냅샷 저장</button></div>
    </div>
  </section>

  <section class="account-grid net-worth-grid">
    <div class="card">
      <div class="card-head"><b>순자산 타임라인</b><span class="muted" id="timeline-note"></span></div>
      <div id="net-worth-chart" class="net-worth-chart"></div>
    </div>
    <div class="card">
      <div class="card-head"><b>최근 자산·부채 구성</b><span class="muted" id="breakdown-asof"></span></div>
      <div id="net-worth-breakdown" class="breakdown-list"></div>
    </div>
  </section>

  <div class="unavailable" id="account-safety"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/account.js?v={{ static_version }}"></script>
</body>
</html>
