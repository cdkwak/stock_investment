<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대시보드 잠금</title>
  <link rel="stylesheet" href="/static/auth.css?v={{ static_version }}">
</head>
<body data-public="{{ '1' if public_mode else '0' }}">
  {% if public_mode %}<div class="guest-banner" role="status" style="padding:6px 16px;text-align:center;background:#fff3cd;color:#5f4b00;border-bottom:1px solid #ead58b;font-size:13px">게스트 모드 · 개인 계좌 정보 없음 · 판단 참고용, 투자 조언 아님</div>{% endif %}
  <main class="auth-card">
    <h1>대시보드 잠금</h1>
    <p class="auth-description">Tailscale에서 대시보드를 열려면 PIN을 입력하세요.</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form action="/login" method="post">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="pin">PIN</label>
      <input
        id="pin"
        name="pin"
        type="password"
        minlength="4"
        maxlength="12"
        autocomplete="current-password"
        autofocus
        required
      >
      <button type="submit">열기</button>
    </form>
    <p class="auth-note">로컬 PC에서는 PIN이 필요하지 않습니다</p>
  </main>
</body>
</html>
