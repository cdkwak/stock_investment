<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Investment · 홈</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body data-public="{{ '1' if public_mode else '0' }}">
<header class="topbar">
  <div class="brand">Stock Investment</div>
  <nav class="nav">
    <a class="on" href="/">홈</a><a href="/market">시장</a><a href="/stocks">종목</a>{% if not public_mode %}<a href="/account">내 계좌</a>{% endif %}<a href="/data">데이터</a><a href="/research">검증</a>
  </nav>
  <div class="topbar-right">
    <span id="as-of" class="muted"></span>
    <span id="health-chip" class="chip dashed" title="데이터 갱신 확인 중">데이터 갱신 확인 중</span>
  </div>
</header>
{% if public_mode %}<div class="guest-banner" role="status" style="padding:6px 16px;text-align:center;background:#fff3cd;color:#5f4b00;border-bottom:1px solid #ead58b;font-size:13px">게스트 모드 · 개인 계좌 정보 없음 · 판단 참고용, 투자 조언 아님</div>{% endif %}

<main class="page" id="home-page" data-initial-symbol="{{ initial_symbol }}">
  <section id="regime" class="regime" data-expanded="auto">
    <div class="regime-cards" id="regime-cards"></div>
    <div class="rules" id="rules"></div>
  </section>

  <section class="tiles" id="tiles"></section>
  <div class="tiles-caption">
    <span id="tiles-more" class="link">지표 더 보기 ▾</span>
    <span class="muted">칸 클릭 → 차트 · 미니그래프: 장중 또는 최근 30일 종가</span>
    <span class="sectors" id="sectors"></span>
  </div>

  <section class="main-row home-dashboard">
    <div class="home-left-col">
      <div class="card chart-card">
        <div class="toolbar" id="chart-toolbar">
          <select id="chart-symbol" class="select" aria-label="차트 종목"></select>
          <div class="segmented" id="chart-interval" aria-label="봉 간격">
            <button type="button" data-v="day" class="on">일</button><button type="button" data-v="week">주</button><button type="button" data-v="month">월</button>
          </div>
          <div class="segmented" id="chart-range" aria-label="조회 기간">
            <button type="button" data-v="3M">3M</button><button type="button" data-v="6M" class="on">6M</button><button type="button" data-v="1Y">1Y</button><button type="button" data-v="3Y">3Y</button><button type="button" data-v="ALL">전체</button>
          </div>
          <div class="indicator-picker" id="home-indicator-picker">
            <button type="button" class="button indicator-picker-button" id="indicator-picker-button" aria-expanded="false" aria-controls="indicator-menu">＋ 지표 추가</button>
            <div class="indicator-menu" id="indicator-menu" hidden>
              <div class="indicator-menu-title">차트에 표시</div>
              <label data-indicator="ma5"><span><input type="checkbox"> MA5</span></label>
              <label data-indicator="ma20"><span><input type="checkbox"> MA20</span></label>
              <label data-indicator="ma60"><span><input type="checkbox"> MA60</span></label>
              <label data-indicator="ma120"><span><input type="checkbox"> MA120</span></label>
              <label data-indicator="bollinger"><span><input type="checkbox"> Bollinger(20,2)</span><small>겹침</small></label>
              <label data-indicator="rsi14"><span><input type="checkbox"> RSI14</span><small>아래 창</small></label>
              <label data-indicator="volume"><span><input type="checkbox"> 거래량</span><small>켜기/끄기</small></label>
            </div>
          </div>
          <div class="toolbar-right" id="chart-stats"></div>
        </div>
        <div id="chart" class="chart"></div>
        <div class="chart-legend" id="chart-legend" aria-label="활성 지표"></div>
      </div>
      <div class="home-left-support" id="bottom-row">
        <div class="card" id="flows-card"><div class="card-head"><b>한국장 수급 · 잔고</b></div><div id="flows"></div></div>
        <div class="card" id="deriv-card"><div class="card-head"><b>파생</b></div><div id="derivatives"></div></div>
      </div>
    </div>
    <aside class="side-col">
      <div class="card" id="watchlist-card">
        <div class="card-head"><b>관심종목 · 보유</b><span class="muted" id="watchlist-meta"></span></div>
        <div class="table" id="watchlist"></div>
      </div>
      <div class="card" id="account-card" data-private-account>
        <div class="card-head"><b>내 계좌</b>
          <div class="segmented small" id="account-range"><button data-v="1M">1M</button><button data-v="3M" class="on">3M</button><button data-v="YTD">YTD</button><button data-v="ALL">전체</button></div>
        </div>
        <div id="account"></div>
      </div>
      <div class="card brief-card" id="brief-card">
        <section><div class="card-head"><b>오늘 일정</b></div><div id="schedule"></div></section>
        <section><div class="card-head"><b>오늘 브리핑</b><span class="muted" id="brief-meta"></span></div><div id="brief"></div></section>
      </div>
    </aside>
  </section>

  <div class="card strip" id="summary-strip"></div>
  <div class="card strip" id="scanner"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
