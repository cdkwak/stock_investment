<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Investment · 홈</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Stock Investment</div>
  <nav class="nav">
    <a class="on" href="/">홈</a><a href="/market">시장</a><a href="/stocks">종목</a><a href="/account">내 계좌</a><a href="/data">데이터</a>
  </nav>
  <div class="topbar-right">
    <span id="as-of" class="muted"></span>
    <span id="health-chip" class="chip dashed">데이터 갱신 확인 중</span>
  </div>
</header>

<main class="page">
  <section id="regime" class="regime" data-expanded="auto">
    <div class="regime-cards" id="regime-cards"></div>
    <div class="rules" id="rules"></div>
    <button class="regime-toggle" id="regime-toggle" type="button">근거 펼치기 ▾</button>
  </section>

  <section class="tiles" id="tiles"></section>
  <div class="tiles-caption">
    <span id="tiles-more" class="link">지표 더 보기 ▾</span>
    <span class="muted">미니 그래프 · 한국 당일 09:00~ · 미국·원자재·환율 24h 선물 · 5일/20일 = 이동평균선 대비 현재 위치 · 칸 클릭 → 차트 전환</span>
    <span class="sectors" id="sectors"></span>
  </div>

  <section class="main-row">
    <div class="card chart-card">
      <div class="toolbar" id="chart-toolbar">
        <select id="chart-symbol" class="select"></select>
        <div class="segmented" id="chart-interval">
          <button data-v="1d" class="on">일</button><button data-v="1w">주</button><button data-v="1M">월</button>
        </div>
        <div class="segmented" id="chart-range">
          <button data-v="3M">3M</button><button data-v="6M" class="on">6M</button><button data-v="1Y">1Y</button><button data-v="3Y">3Y</button><button data-v="ALL">전체</button>
        </div>
        <div class="toolbar-right" id="chart-stats"></div>
      </div>
      <div id="chart" class="chart"></div>
      <div class="chart-legend" id="chart-legend"></div>
    </div>
    <div class="side-col">
      <div class="card" id="watchlist-card">
        <div class="card-head"><b>관심종목 · 보유</b><span class="muted" id="watchlist-meta"></span></div>
        <div class="table" id="watchlist"></div>
      </div>
      <div class="card" id="account-card">
        <div class="card-head"><b>내 계좌</b>
          <div class="segmented small" id="account-range"><button data-v="1M">1M</button><button data-v="3M" class="on">3M</button><button data-v="1Y">1Y</button><button data-v="ALL">전체</button></div>
        </div>
        <div id="account"></div>
      </div>
    </div>
  </section>

  <section class="bottom-row" id="bottom-row">
    <div class="card" id="flows-card"><div class="card-head"><b>한국장 수급 · 잔고</b></div><div id="flows"></div></div>
    <div class="card" id="deriv-card"><div class="card-head"><b>파생</b></div><div id="derivatives"></div></div>
    <div class="card brief-card" id="brief-card">
      <div><div class="card-head"><b>오늘 일정</b></div><div id="schedule"></div></div>
      <div><div class="card-head"><b>오늘 브리핑</b><span class="muted" id="brief-meta"></span></div><div id="brief"></div></div>
    </div>
  </section>
  <div class="card strip" id="summary-strip"></div>
  <div class="card strip" id="scanner"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
