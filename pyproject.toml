[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-investment-rev1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars>=4.13.2,<5",
    "finance-datareader==0.9.202",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pykrx==1.2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.6,<2",
    "optuna>=4,<5",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
    "yfinance==1.6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]
